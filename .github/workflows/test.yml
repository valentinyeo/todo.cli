name: test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseSmall
      - uses: actions/upload-artifact@v4
        with:
          name: zigtodo-windows
          path: |
            zig-out/bin/zigtodo.exe
            zig-out/bin/todo.cli.exe
